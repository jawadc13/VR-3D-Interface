name: Build Quest APK
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sign APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - signing with a throwaway key. Updates will need an uninstall first."
            KEYSTORE_PASS=throwaway
            keytool -genkeypair -keystore release.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=VR World Builder"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias android --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEYSTORE_PASS" --out VRWorldBuilder.apk aligned.apk
          "$BT/apksigner" verify --print-certs VRWorldBuilder.apk | head -5
          rm -f release.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: VRWorldBuilder-apk
          path: android/VRWorldBuilder.apk
      - name: Attach to release
        if: github.event_name == 'release'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "${{ github.event.release.tag_name }}" android/VRWorldBuilder.apk --clobber
